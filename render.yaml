services:
  - type: web
    name: delhi-transit-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/prepare_deploy.py
    startCommand: python -m uvicorn src.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: TRANSIT_CONFIG
        value: config.yaml
      - key: PYTHON_VERSION
        value: 3.12.14
