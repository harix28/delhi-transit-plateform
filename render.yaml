services:
  - type: web
    name: delhi-transit-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/create_demo.py
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TRANSIT_CONFIG
        value: config.demo.yaml
      - key: PYTHON_VERSION
        value: 3.11.9
