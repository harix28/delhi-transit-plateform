<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d37"/>
      <stop offset="50%" stop-color="#0c2f21"/>
      <stop offset="100%" stop-color="#061a12"/>
    </linearGradient>

    <!-- Bus Chassis Gradient -->
    <linearGradient id="busBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f7a55"/>
      <stop offset="60%" stop-color="#15593e"/>
      <stop offset="100%" stop-color="#0d3b29"/>
    </linearGradient>

    <!-- Windshield Gradient -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Headlight Glow -->
    <filter id="lightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Chrome Grill Gradient -->
    <linearGradient id="grillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1b14"/>
      <stop offset="50%" stop-color="#1a382b"/>
      <stop offset="100%" stop-color="#0b1b14"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Transit Range Rings -->
  <circle cx="256" cy="256" r="218" stroke="rgba(52, 211, 153, 0.12)" stroke-width="3" fill="none"/>
  <circle cx="256" cy="256" r="185" stroke="rgba(52, 211, 153, 0.22)" stroke-width="2.5" stroke-dasharray="10 10" fill="none"/>

  <!-- ==================== BUS GRAPHIC ==================== -->
  <g id="delhi-bus-icon">
    <!-- Ground Shadow -->
    <ellipse cx="256" cy="442" rx="150" ry="16" fill="rgba(0, 0, 0, 0.45)"/>

    <!-- 1. TYRES / WHEELS (Left & Right Bottom) -->
    <!-- Left Tyre -->
    <rect x="136" y="360" width="34" height="72" rx="12" fill="#111827"/>
    <rect x="140" y="368" width="14" height="56" rx="6" fill="#1f2937"/>
    <circle cx="147" cy="396" r="4" fill="#9ca3af"/>
    <!-- Right Tyre -->
    <rect x="342" y="360" width="34" height="72" rx="12" fill="#111827"/>
    <rect x="358" y="368" width="14" height="56" rx="6" fill="#1f2937"/>
    <circle cx="365" cy="396" r="4" fill="#9ca3af"/>

    <!-- 2. SIDE REARVIEW MIRRORS -->
    <!-- Left Mirror Arm & Mirror -->
    <path d="M 152 208 L 108 196" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <rect x="94" y="176" width="18" height="54" rx="8" fill="#091f16" stroke="#34d399" stroke-width="3.5"/>
    <rect x="97" y="180" width="12" height="46" rx="5" fill="#38bdf8" opacity="0.85"/>

    <!-- Right Mirror Arm & Mirror -->
    <path d="M 360 208 L 404 196" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <rect x="400" y="176" width="18" height="54" rx="8" fill="#091f16" stroke="#34d399" stroke-width="3.5"/>
    <rect x="403" y="180" width="12" height="46" rx="5" fill="#38bdf8" opacity="0.85"/>

    <!-- 3. ROOF AC POD / HATCH -->
    <rect x="206" y="128" width="100" height="20" rx="8" fill="#1b5a40" stroke="#34d399" stroke-width="3"/>
    <line x1="228" y1="138" x2="284" y2="138" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 4. MAIN BUS CHASSIS BODY -->
    <rect x="146" y="142" width="220" height="265" rx="42" fill="url(#busBodyGrad)" stroke="#34d399" stroke-width="6"/>

    <!-- 5. TOP DIGITAL ROUTE DESTINATION BOARD -->
    <rect x="178" y="160" width="156" height="30" rx="9" fill="#091f16" stroke="#22543d" stroke-width="2"/>
    <!-- Glowing Route text "729 DELHI" -->
    <rect x="188" y="168" width="54" height="14" rx="4" fill="#34d399"/>
    <rect x="252" y="170" width="70" height="10" rx="3" fill="#a7f3d0" opacity="0.8"/>

    <!-- 6. LARGE CURVED BUS WINDSHIELD -->
    <rect x="166" y="202" width="180" height="106" rx="20" fill="url(#windshieldGrad)" stroke="#0f3d2a" stroke-width="4"/>
    <!-- Central Divider -->
    <line x1="256" y1="202" x2="256" y2="308" stroke="#134e35" stroke-width="3.5"/>
    <!-- Glass Glare Highlight -->
    <path d="M 176 212 L 230 212 L 195 296 L 176 296 Z" fill="white" opacity="0.35"/>
    <!-- Windshield Wipers -->
    <line x1="210" y1="300" x2="242" y2="280" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="298" y1="300" x2="330" y2="280" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 7. FRONT RADIATOR GRILL -->
    <rect x="206" y="334" width="100" height="34" rx="10" fill="url(#grillGrad)" stroke="#34d399" stroke-width="2.5"/>
    <!-- Horizontal Slats -->
    <line x1="218" y1="341" x2="294" y2="341" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="218" y1="350" x2="294" y2="350" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="218" y1="359" x2="294" y2="359" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Central DTC / Bus Logo Badge -->
    <circle cx="256" cy="350" r="7" fill="#10b981" stroke="#ffffff" stroke-width="1.8"/>

    <!-- 8. HEADLIGHTS & FOG LAMPS -->
    <!-- Left Main Headlight -->
    <rect x="165" y="332" width="28" height="26" rx="8" fill="#111827" stroke="#34d399" stroke-width="2"/>
    <circle cx="179" cy="345" r="10" fill="#fef08a" filter="url(#lightGlow)"/>
    <circle cx="179" cy="345" r="5" fill="#ffffff"/>
    <!-- Left Indicator Lamp -->
    <circle cx="179" cy="374" r="5" fill="#f59e0b"/>

    <!-- Right Main Headlight -->
    <rect x="319" y="332" width="28" height="26" rx="8" fill="#111827" stroke="#34d399" stroke-width="2"/>
    <circle cx="333" cy="345" r="10" fill="#fef08a" filter="url(#lightGlow)"/>
    <circle cx="333" cy="345" r="5" fill="#ffffff"/>
    <!-- Right Indicator Lamp -->
    <circle cx="333" cy="374" r="5" fill="#f59e0b"/>

    <!-- 9. LOWER BUMPER & REGISTRATION PLATE -->
    <rect x="148" y="386" width="216" height="22" rx="8" fill="#0f2b1d" stroke="#34d399" stroke-width="2"/>
    <!-- Number Plate -->
    <rect x="228" y="389" width="56" height="15" rx="3.5" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="234" y="393" width="44" height="7" rx="1.5" fill="#1f2937"/>
  </g>

  <!-- Live Pulse Waves -->
  <path d="M 80 256 A 200 200 0 0 1 110 180" stroke="#34d399" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 432 256 A 200 200 0 0 0 402 180" stroke="#34d399" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
