<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18523c"/>
      <stop offset="50%" stop-color="#0f3828"/>
      <stop offset="100%" stop-color="#092017"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a7558"/>
      <stop offset="100%" stop-color="#144633"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" stroke="rgba(52, 211, 153, 0.15)" stroke-width="4" fill="none"/>
  <circle cx="256" cy="256" r="170" stroke="rgba(52, 211, 153, 0.25)" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
  
  <!-- Bus Body -->
  <g transform="translate(136, 120)">
    <!-- Main Bus Chassis -->
    <rect x="15" y="20" width="210" height="230" rx="36" fill="url(#shieldGrad)" stroke="#34d399" stroke-width="6"/>
    <!-- Top Destination Display -->
    <rect x="50" y="38" width="140" height="26" rx="8" fill="#091f16" stroke="rgba(52, 211, 153, 0.4)" stroke-width="2"/>
    <rect x="65" y="46" width="110" height="10" rx="4" fill="#34d399" opacity="0.9"/>
    <!-- Windshield -->
    <rect x="35" y="80" width="170" height="80" rx="16" fill="#e6f7f0" opacity="0.95"/>
    <path d="M 120 80 L 120 160" stroke="#174834" stroke-width="3"/>
    <!-- Headlights -->
    <circle cx="48" cy="195" r="14" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="192" cy="195" r="14" fill="#fef08a" filter="url(#glow)"/>
    <rect x="80" y="190" width="80" height="12" rx="6" fill="#091f16"/>
    <line x1="90" y1="196" x2="150" y2="196" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <!-- Wheels -->
    <rect x="35" y="245" width="36" height="24" rx="8" fill="#0b1b14"/>
    <rect x="169" y="245" width="36" height="24" rx="8" fill="#0b1b14"/>
  </g>
  <!-- Live Signal Rays -->
  <path d="M 90 256 A 190 190 0 0 1 120 180" stroke="#34d399" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 422 256 A 190 190 0 0 0 392 180" stroke="#34d399" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
